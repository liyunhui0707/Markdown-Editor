name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-desktop:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Audit complete dependency tree
        run: npm run audit:full

      - name: Build native save verification helpers
        run: |
          npm run build:document-save
          xcrun clang -fobjc-arc -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -DDOCUMENT_SAVE_TESTING -framework Foundation \
            -o "$RUNNER_TEMP/document-save-testing" native/document-save.m

      - name: Run tests and enforce baseline
        env:
          DOCUMENT_NATIVE_SAVE_TEST_BINARY: ${{ runner.temp }}/document-save-testing
          DOCUMENT_NATIVE_SAVE_PRODUCTION_BINARY: ${{ github.workspace }}/apps/desktop/build/document-save
        run: npm run test:ci

      - name: Verify generated assets
        run: npm run verify:generated

      - name: Verify affected Electron workflows
        run: |
          node node_modules/electron/install.js
          E2E_ELECTRON_EXECUTABLE="$PWD/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron" \
            ./node_modules/.bin/playwright test --config=e2e/playwright.config.cjs \
            e2e/dependency-rendering.spec.cjs e2e/document-p1-regressions.spec.cjs \
            e2e/document-accessibility.spec.cjs e2e/document-replace.spec.cjs e2e/document-sustained-writing.spec.cjs e2e/document-mixed-inline.spec.cjs e2e/document-rich-writing.spec.cjs e2e/document-common-compat.spec.cjs e2e/document-file-workflow.spec.cjs \
            --grep 'updated math|document-first read-only opens|confirmed export shortcuts|keyboard workspace|document replace|sustained writing|mixed inline authoring|rich long writing|common Markdown compatibility|daily file workflow'

      - name: Package unsigned macOS app
        run: npm run pack
